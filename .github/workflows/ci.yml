name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      # Windows uses Gentle AI's verified Go SumDB source-build path because
      # the pinned provider release intentionally ships no unsigned Windows
      # binary. Keep the compiler floor explicit in the cross-OS evidence.
      - name: Setup Go for the Windows source-build path
        if: runner.os == 'Windows'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.10"
          check-latest: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          GENTLE_PI_REQUIRE_NATIVE_BINARY: "1"

      - name: Verify generated runtime modules
        run: pnpm run check:runtime-modules

      - name: Verify coordinated release evidence
        run: pnpm run check:release-evidence

      - name: Verify package contents
        run: node scripts/verify-package-files.mjs

      - name: Verify packed installation
        run: pnpm run test:packed-package
