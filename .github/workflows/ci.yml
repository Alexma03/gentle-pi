name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      # The personal fork is built once on every platform. Dependency install
      # stays script-free so it cannot perform a second implicit clone/build.
      - name: Setup Go for the fork source-build path
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.25.10"
          check-latest: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build and register Gentle AI fork
        run: pnpm run install:gentle-ai-fork

      - name: Select the platform fork binary
        run: >-
          node -e "const fs=require('node:fs'); const path=require('node:path');
          const binary=path.resolve('.gentle-ai','custom-main',process.platform==='win32'?'gentle-ai.exe':'gentle-ai');
          fs.appendFileSync(process.env.GITHUB_ENV,'GENTLE_AI_DEV_BINARY='+binary+'\nGENTLE_PI_GENTLE_AI_DEV_BINARY='+binary+'\n')"

      - name: Run tests
        run: pnpm test

      - name: Verify the current personal-fork runtime
        run: pnpm run test:dev-binary
        env:
          GENTLE_PI_REQUIRE_DEV_BINARY: "1"

      - name: Verify coordinated release evidence
        run: pnpm run check:release-evidence

      - name: Verify packed installation
        run: pnpm run test:packed-package
