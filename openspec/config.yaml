schema: spec-driven
artifact_store: hybrid
strict_tdd: true
context: |
  gentle-pi is a Node.js 24 / TypeScript ESM Pi package managed with pnpm 11.
  Runtime entry points live in extensions; reusable orchestration and review logic lives in lib.
  Packaged contracts, agents, chains, prompts, skills, runtime modules, and themes are versioned assets.
  Source uses explicit .ts ESM imports, node: built-ins, tabs, double quotes, and semicolons.
  The root pnpm test command covers node:test units, provider-contract checks, and the Pi runtime harness.
  CI also checks generated runtime modules, package contents, and packed installation on Node.js 24.
  No dedicated linter, formatter, type checker, coverage runner, or application build is configured.
  SDD artifacts are persisted to OpenSpec and mirrored to Engram for recovery.
projects:
  - path: "."
    stack: "Node.js 24, TypeScript ESM, Pi extension package, pnpm 11"
    test_command: "pnpm test"
    test_framework: "node:test plus provider-contract check and custom Pi runtime harness"
    test_layers:
      unit: "node --experimental-strip-types --test tests/*.test.ts"
      integration: "pnpm run test:harness"
      e2e: ""
    coverage_command: ""
    quality:
      lint: ""
      typecheck: ""
      format: ""
      generated_runtime_check: "pnpm run check:runtime-modules"
      package_check: "node scripts/verify-package-files.mjs"
rules:
  proposal:
    - State the problem, intended outcome, scope boundaries, migration strategy, and rollback plan.
    - Identify cross-repository dependencies explicitly.
  spec:
    - Use RFC 2119 keywords for normative requirements.
    - Express acceptance scenarios with Given/When/Then.
  design:
    - Document boundaries, interfaces, capability negotiation, failure behavior, and tradeoffs.
    - Preserve reversible migration seams for runtime or contract replacements.
  tasks:
    - Use dependency-aware, atomic work units with explicit acceptance evidence.
    - Keep independently executable units isolated so safe parallel work is possible.
    - Include a qualitative review-workload forecast before apply.
  apply:
    guidelines:
      - Follow existing TypeScript ESM patterns and keep generated runtime modules synchronized.
      - Preserve RED -> GREEN -> TRIANGULATE -> REFACTOR evidence for behavior changes.
    tdd: true
    test_command: "pnpm test"
  verify:
    test_command: "pnpm test"
    build_command: "pnpm run check:runtime-modules"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive specification deltas.
testing:
  detected: "2026-09-01"
  workspace_test_command: "pnpm test"
  strict_tdd_reason: "The repository contains one discovered project and the explicit root pnpm test command covers its configured unit, contract, and integration suites."
  runner:
    command: "pnpm test"
    framework: "node:test plus provider-contract check and custom Pi runtime harness"
  layers:
    unit: "node:test"
    integration: "custom Pi runtime harness"
    e2e: ""
  commands:
    unit:
      - scope: "."
        command: "node --experimental-strip-types --test tests/*.test.ts"
        framework: "node:test"
    integration:
      - scope: "."
        command: "pnpm run check:provider-contract"
        framework: "provider contract consistency check"
      - scope: "."
        command: "pnpm run test:harness"
        framework: "custom Pi extension runtime harness"
    optional:
      - scope: "."
        command: "pnpm run test:dev-binary"
        framework: "native development-binary tests"
      - scope: "."
        command: "pnpm run test:cross-lane"
        framework: "cross-lane runtime tests"
      - scope: "."
        command: "pnpm run test:maintainer"
        framework: "maintainer-only provider relay tests"
      - scope: "."
        command: "pnpm run test:packed-package"
        framework: "packed installation verification"
    e2e: []
  coverage:
    command: ""
    commands: []
quality:
  lint: ""
  lint_commands: []
  typecheck: ""
  typecheck_commands: []
  format: ""
  format_commands: []
  checks:
    - scope: "."
      command: "pnpm run check:runtime-modules"
      purpose: "Verify generated runtime modules match their sources."
    - scope: "."
      command: "node scripts/verify-package-files.mjs"
      purpose: "Verify the published package file set."
